[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ips-wifi-research"
version = "0.1.0"
description = "Reproducible WiFi fingerprinting experiments on UJIIndoorLoc"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "torch>=2.2",
]

[project.scripts]
ips-train = "ips.experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
